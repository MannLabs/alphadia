# configuration for multistep search
# for each of the three steps, the configuration values defined here override the default values and the values defined by the user

# future : default.yaml -> user.yaml -> multistep_user.yaml -> multistep.yaml

# TODO: rename back to adaptation: once backward compat with transfer_step_enabled is dropped
transfer:
#  library_prediction:  # should be done in 99% of cases
#      predict: True
  transfer_library:
    enabled: True
  # transfer_learning: enabled and context_extraction: enabled are injected by search_plan.py
  # based on adaptation_method ("transfer" or "tto")

  # override settings that could have been set by the user:
  quant_directory: null # is step-specific, so user-defined values are not applicable as they would overwrite all steps' values with a single value
  general:
    save_library: False
  # TODO: think about enforcing optimization of rt here

library:
  # override settings that could have been set by the user:
  quant_directory: null # is step-specific, so user-defined values are not applicable as they would overwrite all steps' values with a single value
  general:
    save_mbr_library: True
    save_library: False
  transfer_library:
    enabled: False
  transfer_learning:
    enabled: False
# will be set in search_plan.py if adaptation step is enabled:
#  library_prediction:
#    enabled: True
#    peptdeep_model_path: <value from adaptation step> (transfer method)
#    context_path: <value from adaptation step> (tto method)

mbr:
  fasta_paths: []
  fdr:
    inference_strategy: library
  search:
    target_num_candidates: 5
  # override settings that could have been set by the user:
  quant_directory: null # is step-specific, so user-defined values are not applicable as they would overwrite all steps' values with a single value
  library_prediction:
    enabled: False
  transfer_library:
    enabled: False
  transfer_learning:
    enabled: False
# will be set in search_plan.py if mbr step is enabled:
#  library_path: <value from library step>
#  search:
#    target_ms1_tolerance: <value from adaptation or library step>
#    target_ms2_tolerance: <value from adaptation or library step>
