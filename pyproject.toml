[build-system]
requires = ["setuptools", "setuptools-rust>=1.11"]
build-backend = "setuptools.build_meta"

[project]
name = "alphadia"
requires-python = ">=3.11.0"
dynamic = ["version", "dependencies", "optional-dependencies"]

authors = [
    {name = "Mann Labs", email = "wallmann@biochem.mpg.de"}
]
description = "A novel proteomics search engine for DIA data based on end-to-end transfer learning."
readme = "README.md"
keywords = [
    "mass spectrometry",
    "proteomics",
    "search engine",
    "DIA",
    "data-independent acquisition",
    "bioinformatics",
    "AlphaPept",
    "AlphaPept ecosystem",
    "alphapept.org",
]
license = {file = "LICENSE.txt"}
classifiers = [
    "Development Status :: 4 - Beta",
    # "Development Status :: 5 - Production/Stable",
    # "Development Status :: 6 - Mature",
    # "Development Status :: 7 - Inactive"
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]

repository = "https://github.com/MannLabs/alphadia"
issues = "https://github.com/MannLabs/alphadia/issues"
download = "https://github.com/MannLabs/alphadia/releases"
homepage = "https://www.alphapept.org"
"Mann Labs Homepage" = "https://www.biochem.mpg.de/mann"
publication = "https://doi.org/10.1038/s41587-025-02791-w"
documentation = "https://alphadia.readthedocs.io/en/latest/"

[tool.setuptools.packages]
find = {}

[tool.setuptools.dynamic]
# https://stackoverflow.com/a/73600610
dependencies = {file = ["requirements/requirements.txt"]}
optional-dependencies.stable = { file = ["requirements/_requirements.freeze.txt"] }
optional-dependencies.tests = { file = ["requirements/requirements_tests.txt"] }
optional-dependencies.docs = { file = ["requirements/requirements_docs.txt"] }
optional-dependencies.development = { file = [
    "requirements/requirements_development.txt",
    "requirements/requirements_tests.txt",
    "requirements/requirements_docs.txt"] }

version = {attr = "alphadia.__version__"}

[project.scripts]
alphadia = "alphadia.cli:run"

[[tool.setuptools-rust.ext-modules]]
target = "alphadia._rust"
path = "rust/Cargo.toml"
binding = "PyO3"
# only set when building the Python extension, so `cargo test` can still link against libpython
features = ["pyo3/extension-module"]
# editable installs (`pip install -e .`, used in CI and e2e tests) would otherwise get an unoptimized debug build,
# for fast debug builds while iterating on Rust code use `maturin develop` (see below)
debug = false

# Only used for local development via `maturin develop [--release]`, mirroring alphadia-search-rs.
# Wheels and releases are built by setuptools-rust (above), because maturin can't read the dependencies from requirements/*.txt.
# Keep module-name and features in sync with the setuptools-rust section.
[tool.maturin]
manifest-path = "rust/Cargo.toml"
module-name = "alphadia._rust"
features = ["pyo3/extension-module"]

[tool.cibuildwheel]
build = ["cp311-*", "cp312-*", "cp313-*"]
archs = ["auto64"]
skip = ["*-musllinux_*"]

[tool.cibuildwheel.linux]
# the manylinux containers do not ship a Rust toolchain
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }


[tool.ruff.lint]
select =  [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

ignore = [
    "E501",  # Line too long  (ruff wraps code, but not docstrings)
    "B028",  #  No explicit `stacklevel` keyword argument found (for warnings)
    "B905"  # This causes problems in numba code: `zip()` without an explicit `strict=` parameter
]

[tool.ty.src]
exclude = [
    "tests",
    "nbs",
    # TODO: enable these
    "alphadia/workflow",
    "alphadia/outputtransform",
    "alphadia/transferlearning",
    "alphadia/search",
    "alphadia/fdr/_fdrx",
]
