# Publish and test releases on Test-PyPI and PyPI.
# This replaces MannLabs/alphashared/.github/workflows/publish_on_pypi.yml, which can only publish a single
# pure-python wheel, while alphadia ships one wheel per platform and python version due to its Rust extension.
name: Publish on PyPi

on:
  workflow_dispatch:
    inputs:
      tag_to_release:
        description: 'Enter tag to release (example: v1.5.5). A tag with the same name must exist in the repository.'
        type: string
        required: true
      only_testpypi_release:
        description: 'If true, the release on "real" pypi will be skipped.'
        type: boolean
        default: false

env:
  PACKAGE_NAME: alphadia
  PYTHON_VERSION: "3.11"

jobs:
  Check_Tag:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.get_current_version.outputs.new_version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # required to be able to check for existing tags
      - name: Check if tag exists
        run: |
          TAG="${{ inputs.tag_to_release }}"
          if git show-ref --tags --verify --quiet "refs/tags/${TAG}"; then
            echo "Tag ${TAG} exists, continuing .."
          else
            echo "Tag ${TAG} does not exist. Did you forget to publish the release?"
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag_to_release }}
      - name: Get current version
        id: get_current_version
        run: |
          CURRENT_VERSION=$(grep "__version__" ${{ env.PACKAGE_NAME }}/__init__.py | cut -f3 -d ' ' | sed 's/"//g')
          echo "new_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

  Build:
    needs: Check_Tag
    uses: ./.github/workflows/_build_wheels.yml
    with:
      ref: ${{ inputs.tag_to_release }}

  Publish_On_Test_PyPi:
    needs: [Check_Tag, Build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check package
        # twine==6.1.0 yields "ERROR    InvalidDistribution: Invalid distribution metadata: unrecognized or malformed field 'license-file'"
        # cf. https://github.com/pypa/twine/issues/1216
        run: |
          ls -l dist
          pip install twine==6.0.1
          twine check --strict dist/*
      - name: Publish distribution to Test-PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true # this is to cover cases where the upload has already been done but some downstream steps failed
        with:
          repository-url: https://test.pypi.org/legacy/
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true
          print-hash: true
          verbose: true

  Test_Test_PyPi_Release:
    name: Test_Test_PyPi_version_on_${{ matrix.os }}
    needs: [Check_Tag, Publish_On_Test_PyPi]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        install_type: ["", "[stable]"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check Test-PyPI installation
        shell: bash
        run: |
          # --only-binary: falling back to the sdist would silently hide a missing platform wheel
          # retries cover delays on the pypi side
          for attempt in 1 2 3; do
            pip install --only-binary ${{ env.PACKAGE_NAME }} --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple \
              "${{ env.PACKAGE_NAME }}${{ matrix.install_type }}==${{ needs.Check_Tag.outputs.new_version }}" && break
            if [ $attempt -eq 3 ]; then exit 1; fi
            sleep 30
          done
          alphadia --check

  Publish_On_PyPi:
    needs: [Check_Tag, Test_Test_PyPi_Release]
    if: ${{ !inputs.only_testpypi_release }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          print-hash: true
          verbose: true

  Test_PyPi_Release:
    name: Test_PyPi_version_on_${{ matrix.os }}
    needs: [Check_Tag, Publish_On_PyPi]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        install_type: ["", "[stable]"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check PyPI installation
        shell: bash
        run: |
          for attempt in 1 2 3; do
            pip install --only-binary ${{ env.PACKAGE_NAME }} "${{ env.PACKAGE_NAME }}${{ matrix.install_type }}==${{ needs.Check_Tag.outputs.new_version }}" && break
            if [ $attempt -eq 3 ]; then exit 1; fi
            sleep 30
          done
          alphadia --check
