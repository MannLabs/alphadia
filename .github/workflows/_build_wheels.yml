# Build the platform-specific wheels (alphadia contains a compiled Rust extension) and the sdist.
# Configuration of the wheel builds (python versions, architectures, ...) is in the [tool.cibuildwheel] section of pyproject.toml.
# Can be triggered manually to check the build on a branch without publishing anything.
name: Build wheels

on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit, branch or tag to build.'
        type: string
        required: true
  workflow_dispatch:

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # native runners per architecture, emulating aarch64 via QEMU is very slow for Rust builds
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: pypa/cibuildwheel@v4.3.4
        with:
          output-dir: dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-wheels-${{ matrix.os }}
          path: dist/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-sdist
          path: dist/*.tar.gz
