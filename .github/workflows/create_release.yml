# Create a draft release and build and upload all installers to it.
name: Create Release

on:
  workflow_dispatch:
    inputs:
      commitish_to_release:
        type: string
        description: 'Enter commit hash or branch to release (default: main).'
        default: "main"

jobs:
  create-release:
    uses: MannLabs/alphashared/.github/workflows/create_release.yml@platform-wheels  # TODO: back to @v1 once released in alphashared
    secrets: inherit
    permissions:
      contents: write
    with:
      package_name: alphadia
      commitish_to_release: ${{ inputs.commitish_to_release }}
      build_nodejs_ui: true
      test_app: false
      platform_wheels: true  # compiled Rust extension
